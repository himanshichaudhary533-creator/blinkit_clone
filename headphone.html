<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .main-container {
        /* border: 2px solid red; */
        height: 100vh;
        background-color: rgb(149, 190, 149);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-container {
        /* border: 2px solid red; */
        background-color: white;
        border-radius: 30px;
        width: 25%;
        height: 80%
    }

    .image-container {
        height: 50%;
        background-color: rgb(201, 199, 199);
        border-radius: 30px 30px 0 0;
        display: flex;
        justify-content: center;
        overflow: hidden;



    }

    .image-container img {
        height: 100%;
        width: 55%;
        transition: 0.5s ease-in-out;
    }

    .image-container img:hover{
        scale: 1.2;
    }

    .image-description {
        height: 35%;
        padding:20px;
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        /* justify-items: center; */
        align-content: center;
        border-bottom: 1px solid lightgrey;

    }

    .image-description p{
        font-size: 18px;
    }

    .img-desc-btn{
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .img-desc-btn button{
        height: 65%;
        width: 30%;
        border-radius: 5px;
        border:1px solid lightgrey;
        background-color: transparent;
    }

    .image-price{
        height:15%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
    }

    .image-price h1 span{
        font-size: 18px;
        font-weight: 300;
        text-decoration: line-through;
    }

    .image-price button{
        width: 60%;
        height: 90%;
        border:none;
        border-radius: 5px;
        background: linear-gradient(to right, #45e84f, #c7ee35);
        transition: 0.5s ease-in-out;
    }

    .image-price button:hover{
        cursor: pointer;
        scale: 1.1;

    }

    
</style>

<body>

    <div class="main-container">
        <div class="card-container">
            <div class="image-container">
                <img src="https://foconoaprendiz.com.br/wp-content/uploads/2020/06/alexunder-hess-bWZAPKm0zZE-unsplash.jpg" />
            </div>
            <div class="image-description">
                <h1>Boat Stone 1200F</h1>
                <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quos, animi.</p>
                <div class="img-desc-btn">
                    <button>Green</button>
                    <button>Just the Device</button>
                </div>
            </div>
            <div class="image-price">
                <h1><span>$2000</span>$599</h1>
                <button>+ Add to Cart</button>
            </div>
        </div>
    </div>
</body>

</html>
